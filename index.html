<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uma pergunta para Franciele 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container" id="container">
    <div class="hearts" aria-hidden="true">♡　♥　♡</div>

    <section class="question-card" id="questionCard">
      <div class="tiny-heart" aria-hidden="true">♥</div>
      <p class="eyebrow">UMA PERGUNTA MUITO IMPORTANTE</p>
      <h1>Franciele é o amor da vida de Lucas?</h1>
      <p class="subtitle">Pense bem antes de responder... 💌</p>

      <div class="buttons" id="buttons">
        <button class="btn btn-yes" id="yesButton">Sim! 💗</button>
        <button class="btn btn-no" id="noButton">Não 🙃</button>
      </div>
      <p class="hint">Escolha com carinho.</p>
    </section>

    <section class="love-message" id="loveMessage" aria-live="polite" hidden>
      <div class="big-heart" aria-hidden="true">♥</div>
      <p class="love-eyebrow">EU JÁ SABIA!</p>
      <h2>AMO VOCÊ</h2>
      <div class="confetti-hearts" aria-hidden="true">♥　♡　♥　♡　♥</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
